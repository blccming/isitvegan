version: 2
updates:
  # Abhängigkeiten aus package.json wöchentlich prüfen und PRs anlegen.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Auch die Actions in .github/workflows aktuell halten.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
